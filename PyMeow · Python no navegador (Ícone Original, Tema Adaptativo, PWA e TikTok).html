<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" id="meta-theme" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PyMeow">
<title>PyMeow · Python no navegador</title>
<link id="fav" rel="icon">
<link id="apple-icon" rel="apple-touch-icon">
<link id="pwa-manifest" rel="manifest">
<style>
:root{
  --bg:#0d1117;
  --pn:#161b22;
  --bd:#30363d;
  --tx:#c9d1d9;
  --bl:#3776ab;
  --ye:#ffd43b;
  --gr:#8b949e;
  --code-font: 400 13px/20px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg:#f6f8fa;
  --pn:#ffffff;
  --bd:#d0d7de;
  --tx:#1f2328;
  --bl:#2b6596;
  --ye:#b07d00;
  --gr:#57606a;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,sans-serif;overflow:hidden;transition:background-color .2s,color .2s}
body{display:flex;flex-direction:column}

/* Cabeçalho */
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--bd);flex-shrink:0}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;margin-right:auto;user-select:none}
.logo img{width:32px;height:32px;border-radius:8px;object-fit:cover;border:1px solid var(--bd)}
.logo b{color:var(--bl);margin-right:-6px}
.logo span{color:var(--ye)}

button,select,a.tt-btn{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;cursor:pointer;transition:border-color .15s,background-color .15s,color .15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
button:hover:not(:disabled),select:hover,a.tt-btn:hover{border-color:var(--gr)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--ye);outline-offset:1px}

a.tt-btn{font-size:13px;font-weight:600}
a.tt-btn svg{width:15px;height:15px;flex-shrink:0}
a.tt-btn .tt-badge{color:var(--ye)}

#run{background:var(--bl);border-color:var(--bl);color:#fff;font-weight:600}
#run:hover:not(:disabled){background:#2d628f;border-color:#2d628f}
#run.stop{background:#8b2d2d;border-color:#8b2d2d}
#run.stop:hover{background:#a33636;border-color:#a33636}
#run small{opacity:.75;font-weight:400;margin-left:6px}

#st{display:flex;align-items:center;gap:6px;color:var(--gr);font-size:13px;padding-left:4px}
#st::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ye);flex-shrink:0}
#st[data-s=ready]::before{background:#3fb950}
#st[data-s=running]::before{background:#58a6ff;animation:p 1s infinite}
#st[data-s=error]::before{background:#f85149}
@keyframes p{50%{opacity:.3}}

#bar{height:3px;background:var(--bd);transition:opacity .35s;flex-shrink:0}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bl),var(--ye));transition:width .25s ease-out}

/* Layout principal e divisor */
main{flex:1;display:flex;min-height:0;overflow:hidden}
.l{flex:0 0 var(--l,52%)}
.r{flex:1}
.l,.r{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--pn)}
#sp{flex:0 0 6px;background:var(--bd);cursor:col-resize;touch-action:none;transition:background .15s}
#sp:hover,#sp.on{background:var(--ye)}

/* Abas superiores */
.bar{display:flex;gap:2px;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--bd);padding:4px 6px 0;flex-shrink:0;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
#tabs{display:flex;gap:2px}
.tab,.rt{border:0;border-radius:6px 6px 0 0;background:none;color:var(--gr);white-space:nowrap;padding:6px 10px;font-size:13px}
.tab:hover,.rt:hover{color:var(--tx);background:#161b2288}
.tab.on,.rt.on{background:var(--pn);color:var(--ye);font-weight:600}
.tab span{margin-left:8px;opacity:.7;padding:0 2px;border-radius:3px}
.tab span:hover{opacity:1;color:#fff;background:#30363d}

/* Editor com alinhamento tipográfico exato */
.wrap{flex:1;display:flex;min-height:0;position:relative;overflow:hidden}
.gut{flex:0 0 48px;overflow:hidden;border-right:1px solid var(--bd);background:var(--pn);user-select:none}
#ln{
  margin:0;
  padding:12px 8px 12px 0;
  font:var(--code-font);
  letter-spacing:0;
  text-align:right;
  color:var(--gr);
  white-space:pre;
  will-change:transform;
}
.ed{flex:1;position:relative;overflow:hidden;background:var(--pn)}
#hl,#ta{
  margin:0;
  padding:12px;
  border:0;
  font:var(--code-font);
  letter-spacing:0;
  tab-size:4;
  -moz-tab-size:4;
  white-space:pre;
  word-wrap:normal;
  overflow-wrap:normal;
  font-variant-ligatures:none;
}
#hl{
  position:absolute;
  top:0;
  left:0;
  min-width:100%;
  min-height:100%;
  pointer-events:none;
  color:var(--tx);
  will-change:transform;
}
#ta{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  outline:0;
  resize:none;
  overflow:auto;
  background:transparent;
  color:transparent;
  caret-color:var(--ye);
  -webkit-text-fill-color:transparent;
}
#ta::selection{background:#3776ab77;color:transparent}
#hl i{font-style:normal}
#hl .k{color:#ff7b72}
#hl .b{color:#79c0ff}
#hl .s{color:#a5d6ff}
#hl .c{color:var(--gr);font-style:italic}
#hl .d{color:var(--ye)}
#hl .n{color:#d2a8ff}
:root[data-theme="light"] #hl .k{color:#cf222e}
:root[data-theme="light"] #hl .b{color:#0550ae}
:root[data-theme="light"] #hl .s{color:#0a3069}
:root[data-theme="light"] #hl .d{color:#953800}
:root[data-theme="light"] #hl .n{color:#8250df}

/* Painéis da direita (Console, Gráficos, Pacotes) */
.pane{flex:1;min-height:0;overflow:auto;padding:12px}
#con{font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;background:var(--bg)}
#con .e{color:#ff7b72}
:root[data-theme="light"] #con .e{color:#cf222e}
#con .sy{color:var(--gr);font-style:italic}
#con .u{color:var(--ye);font-weight:600}
.in{background:var(--pn);border:1px solid var(--bd);border-radius:4px;padding:1px 6px;color:var(--ye);font:inherit;outline:0;width:min(65%,42ch)}

#plt{display:flex;flex-direction:column;gap:14px;align-items:center}
#plt:empty::before{content:"Nenhum gráfico ainda. Use plt.show() no seu código.";color:var(--gr);margin-top:24px}
#plt img{max-width:100%;border:1px solid var(--bd);border-radius:6px;cursor:pointer;transition:transform .15s,border-color .15s}
#plt img:hover{border-color:var(--ye)}

#q{width:100%;margin-bottom:8px;padding:8px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font:inherit}
#q:focus{border-color:var(--ye);outline:0}
.pk{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--bd)}
.pk div{flex:1;min-width:0}
.pk small{display:block;color:var(--gr);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Diálogo inline não-bloqueante (substitui prompt/confirm nativos) */
#dlg-bg{position:fixed;inset:0;background:#010409aa;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#dlg{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:16px;width:min(380px,100%);box-shadow:0 12px 32px #00000088}
#dlg h3{margin:0 0 10px;font-size:15px;color:var(--tx)}
#dlg p{margin:0 0 12px;font-size:13px;color:var(--gr);line-height:1.4}
#dlg input{width:100%;padding:8px 10px;margin-bottom:12px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font:inherit}
#dlg input:focus{border-color:var(--ye);outline:0}
#dlg .act{display:flex;justify-content:flex-end;gap:8px}
#dlg .ok{background:var(--bl);border-color:var(--bl);color:#fff;font-weight:600}

@media(max-width:760px){
  main{flex-direction:column}
  #sp{cursor:row-resize}
  #run small{display:none}
}
</style>
</head>

<header>
  <div class="logo"><img id="lg" alt="PyMeow"><b>Py</b><span>Meow</span></div>
  <a class="tt-btn" href="https://www.tiktok.com/@zeezz9711" target="_blank" rel="noopener noreferrer" title="Abrir TikTok @zeezz9711" aria-label="TikTok @zeezz9711">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
    <span>TikTok</span><span class="tt-badge">@zeezz9711</span>

  <select id="ex" aria-label="Exemplos prontos"></select>
  <button id="theme-btn" type="button" title="Alternar tema claro/escuro" aria-label="Alternar tema">🌓 Auto</button>
  <button id="run" disabled title="Ctrl+Enter">▶ Executar<small>Ctrl+Enter</small></button>
  <button id="clr">Limpar Console</button>

<div id="bar"><i></i></div>
<main id="m">
  <section class="l">
    <div class="bar">
      <div id="tabs"></div>
      <button class="tab" id="add" title="Novo arquivo">+</button>
      <button class="tab" id="up" title="Enviar arquivo">↑ Enviar</button>
      <input type="file" id="fi" multiple hidden>
    </div>
    <div class="wrap">
      <div class="gut"><pre id="ln" aria-hidden="true">1</pre></div>
      <div class="ed">
        <pre id="hl" aria-hidden="true"></pre>
        <textarea id="ta" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" aria-label="Editor de código Python"></textarea>
      </div>
    </div>
  </section>
  <div id="sp" role="separator" aria-label="Redimensionar painéis"></div>
  <section class="r">
    <div class="bar">
      <button class="rt on" data-p="con">Console</button>
      <button class="rt" data-p="plt">Gráficos</button>
      <button class="rt" data-p="pk">Pacotes</button>
    </div>
    <div class="pane" id="con"></div>
    <div class="pane" id="plt" hidden></div>
    <div class="pane" id="pk" hidden>
      <input id="q" placeholder="Buscar ou digitar um pacote (Enter instala)" autocomplete="off">
      <div id="pl"></div>
    </div>
  </section>
</main>

<!-- Modal leve para criar arquivo ou confirmar ações sem usar window.prompt/confirm -->
<div id="dlg-bg" hidden>
  <div id="dlg" role="dialog" aria-modal="true">
    <h3 id="dlg-t"></h3>
    <p id="dlg-p" hidden></p>
    <input id="dlg-i" hidden autocomplete="off">
    <div class="act">
      <button id="dlg-no">Cancelar</button>
      <button id="dlg-ok" class="ok">Confirmar</button>
    </div>
  </div>
</div>

def _nm(f):
    return f.id if isinstance(f, ast.Name) else f.attr if isinstance(f, ast.Attribute) else None

def _imps(t):
    s = set()
    for n in ast.walk(t):
        if isinstance(n, ast.Import):
            s |= {a.name.split(".")[0] for a in n.names}
        elif isinstance(n, ast.ImportFrom) and not n.level and n.module:
            s.add(n.module.split(".")[0])
    return s

def _has(m):
    try:
        return (
            m in sys.stdlib_module_names
            or importlib.util.find_spec(m) is not None
            or os.path.exists(m + ".py")
        )
    except Exception:
        return False

async def _auto(t):
    import pyodide_js, micropip
    ms = _imps(t)
    missing = [m for m in sorted(ms) if not _has(m)]
    if missing:
        emit("progress", 25)
        for idx, m in enumerate(missing):
            p = PIP.get(m, m)
            emit("progress", 25 + int((idx / max(1, len(missing))) * 65))
            print(f"[PyMeow] carregando/instalando {p}…")
            try:
                await pyodide_js.loadPackage(p)
            except Exception:
                try:
                    await micropip.install(p)
                except Exception as e:
                    print(f"[PyMeow] falha ao instalar {p}: {str(e)[:280]}", file=sys.stderr)
        emit("progress", 95)

    if "matplotlib" in ms or "matplotlib" in sys.modules:
        _setup_mpl()

    if ms & {"requests", "urllib3"}:
        try:
            await micropip.install("pyodide-http")
            import pyodide_http
            pyodide_http.patch_all()
        except Exception:
            pass

def _is_dunder(name):
    return len(name) > 4 and name.startswith("__") and name.endswith("__")

def _asyncs(t):
    fs = [n for n in ast.walk(t) if isinstance(n, ast.FunctionDef) and not _is_dunder(n.name)]
    a = set()
    ch = True
    while ch:
        ch = False
        for f in fs:
            if f.name in a:
                continue
            for c in ast.walk(f):
                if isinstance(c, ast.Call):
                    fn = _nm(c.func)
                    if (isinstance(c.func, ast.Name) and c.func.id == "input") or fn in a:
                        a.add(f.name)
                        ch = True
                        break
    return a

class _T(ast.NodeTransformer):
    def __init__(self, a):
        self.a = a
        self._in_sync_fn = False

    def visit_FunctionDef(self, n):
        if n.name in self.a:
            prev = self._in_sync_fn
            self._in_sync_fn = False
            self.generic_visit(n)
            self._in_sync_fn = prev
            return ast.copy_location(
                ast.AsyncFunctionDef(**{k: getattr(n, k) for k in n._fields}),
                n
            )
        prev = self._in_sync_fn
        self._in_sync_fn = True
        self.generic_visit(n)
        self._in_sync_fn = prev
        return n

    def visit_Call(self, n):
        self.generic_visit(n)
        if self._in_sync_fn:
            return n
        if isinstance(n.func, ast.Name) and n.func.id == "input":
            n.func = ast.Name("_ainput", ast.Load())
            return ast.Await(n)
        if _nm(n.func) in self.a:
            return ast.Await(n)
        return n

async def _run(src, name):
    for k, m in list(sys.modules.items()):
        f = getattr(m, "__file__", None)
        if isinstance(f, str) and os.path.dirname(os.path.abspath(f)) == os.getcwd():
            del sys.modules[k]
    g = {"__name__": "__main__", "__file__": name, "_ainput": _ainput}
    try:
        t = ast.parse(src, name)
        await _auto(t)
        t = _T(_asyncs(t)).visit(t)
        ast.fix_missing_locations(t)
        r = eval(compile(t, name, "exec", flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT), g)
        if inspect.isawaitable(r):
            await r
    except SystemExit:
        pass
    except BaseException:
        et, e, tb = sys.exc_info()
        while tb and tb.tb_frame.f_code.co_filename == "<exec>":
            tb = tb.tb_next
        traceback.print_exception(et, e, tb)
    finally:
        _flush_plots()
`;

/* ===== Web Worker (serializado via Blob para manter arquivo único) ===== */
function workerMain(PY_PRIMARY, PY_FALLBACK, BOOT){
  let activePY = PY_PRIMARY;
  try {
    importScripts(activePY + "pyodide.js");
  } catch (e1) {
    try {
      activePY = PY_FALLBACK;
      importScripts(activePY + "pyodide.js");
    } catch (e2) {
      postMessage({t:"fatal", s:`Não foi possível baixar o Pyodide (${PY_PRIMARY} nem ${PY_FALLBACK}).`});
      return;
    }
  }

  let py, pend;
  const P = (t, o) => postMessage({t, ...o});
  const st = (s, p, m) => P("status", {s, p, m});
  const TXT = /\.(py|csv|json|txt|md|tsv)$/i;
  const isF = n => { try { return py.FS.isFile(py.FS.stat(n).mode); } catch { return false; } };
  const list = () => py.FS.readdir(".").filter(n => n[0] !== "." && n !== "__pycache__" && n !== "tmp" && n !== "home" && n !== "dev" && n !== "proc" && isF(n));

  const pkgs = async () => {
    try {
      const r = await py.runPythonAsync("import micropip, json\njson.dumps({k: v.version for k, v in micropip.list().items()})");
      P("pkgs", {d: JSON.parse(r)});
    } catch {}
  };

  (async () => {
    try {
      st("loading", 15, "iniciando WebAssembly");
      py = await loadPyodide({
        indexURL: activePY,
        stdout: s => P("out", {s: s + "\n"}),
        stderr: s => P("err", {s: s + "\n"})
      });
      st("loading", 55, "carregando micropip");
      await py.loadPackage("micropip");
      st("loading", 85, "configurando ambiente");
      self.emit = (t, d) => P(t, {d});
      self.ask = p => new Promise(r => { pend = r; P("input", {p}); });
      self.askSync = p => {
        P("out", {s: (p ? p + " " : "") + "[entrada síncrona ignorada em método especial]\n"});
        return "";
      };
      await py.runPythonAsync(BOOT);
      await pkgs();
      st("ready", 100);
    } catch (e) {
      P("fatal", {s: String(e)});
    }
  })();

  onmessage = async ({data: d}) => {
    if (d.t === "stdin") {
      if (pend) { const fn = pend; pend = null; fn(d.v); }
      return;
    }
    if (!py) return;
    try {
      st("running", 10);
      if (d.t === "run") {
        list().forEach(n => { try { py.FS.unlink(n); } catch {} });
        for (const n in d.files) {
          py.FS.writeFile(n, d.files[n]);
        }
        py.globals.set("_SRC", d.code);
        py.globals.set("_NAME", d.name);
        await py.runPythonAsync("await _run(_SRC, _NAME)");
        const o = {};
        for (const n of list()) {
          const b = py.FS.readFile(n);
          o[n] = TXT.test(n) ? new TextDecoder().decode(b) : b;
        }
        P("files", {d: o});
      } else if (d.t === "install") {
        st("running", 35);
        py.globals.set("_PKG", d.pkg);
        await py.runPythonAsync("import pyodide_js, micropip\ntry:\n await pyodide_js.loadPackage(_PKG)\nexcept Exception:\n await micropip.install(_PKG)");
        P("out", {s: "[PyMeow] " + d.pkg + " instalado\n"});
      }
      await pkgs();
    } catch (e) {
      P("err", {s: String(e.message || e) + "\n"});
    }
    st("ready", 100);
  };
}

/* ===== Ícones PWA em PNG (192x192 e 512x512) a partir da imagem LOGO original + Manifest + Service Worker ===== */
function makePwaIconPng(size, callback) {
  try {
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement("canvas");
        c.width = size;
        c.height = size;
        const ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0, size, size);
        callback(c.toDataURL("image/png"));
      } catch {
        callback(LOGO);
      }
    };
    img.onerror = () => callback(LOGO);
    img.src = LOGO;
  } catch {
    callback(LOGO);
  }
}

$("#lg").src = LOGO;
$("#fav").href = LOGO;
$("#apple-icon").href = LOGO;

function buildManifest(icon192, icon512) {
  try {
    const manifest = {
      name: "PyMeow · Python no navegador",
      short_name: "PyMeow",
      description: "Ambiente Python interativo no navegador com WebAssembly, gráficos e pacotes sob demanda.",
      start_url: "./",
      scope: "./",
      display: "standalone",
      orientation: "any",
      background_color: "#0d1117",
      theme_color: "#0d1117",
      icons: [
        { src: icon192, sizes: "192x192", type: "image/png", purpose: "any maskable" },
        { src: icon512, sizes: "512x512", type: "image/png", purpose: "any maskable" }
      ]
    };
    const mBlob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    const prev = $("#pwa-manifest").href;
    $("#pwa-manifest").href = URL.createObjectURL(mBlob);
    if (prev && prev.startsWith("blob:")) {
      setTimeout(() => URL.revokeObjectURL(prev), 1500);
    }
  } catch {}
}

function setupPwa() {
  buildManifest(LOGO, LOGO);
  makePwaIconPng(192, i192 => {
    $("#apple-icon").href = i192;
    makePwaIconPng(512, i512 => {
      buildManifest(i192, i512);
    });
  });

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    try {
      const swCode = `
        const CACHE_NAME = "pymeow-pwa-v1";
        self.addEventListener("install", e => {
          self.skipWaiting();
          e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(["./"]).catch(() => {})));
        });
        self.addEventListener("activate", e => {
          e.waitUntil(
            caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k))))
              .then(() => self.clients.claim())
          );
        });
        self.addEventListener("fetch", e => {
          if (e.request.method !== "GET") return;
          e.respondWith(
            fetch(e.request).then(res => {
              if (res && res.status === 200 && res.type === "basic") {
                const clone = res.clone();
                caches.open(CACHE_NAME).then(c => c.put(e.request, clone)).catch(() => {});
              }
              return res;
            }).catch(() => caches.match(e.request))
          );
        });
      `;
      const swBlob = new Blob([swCode], { type: "application/javascript" });
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl, { scope: "./" }).catch(() => {});
    } catch {}
  }
}
setupPwa();

/* ===== Tema adaptativo (auto por padrão + alternância manual) ===== */
const mqTheme = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;
let themeMode = "auto"; // "auto" | "dark" | "light"

function applyTheme() {
  const effective = themeMode === "auto"
    ? (mqTheme && mqTheme.matches ? "light" : "dark")
    : themeMode;
  document.documentElement.setAttribute("data-theme", effective);
  const bgMeta = effective === "light" ? "#f6f8fa" : "#0d1117";
  const mt = $("#meta-theme");
  if (mt) mt.setAttribute("content", bgMeta);
  const btn = $("#theme-btn");
  if (btn) {
    btn.textContent = themeMode === "auto"
      ? `🌓 Auto (${effective === "light" ? "Claro" : "Escuro"})`
      : (effective === "light" ? "☀️ Claro" : "🌙 Escuro");
  }
}

$("#theme-btn").onclick = () => {
  themeMode = themeMode === "auto" ? "light" : (themeMode === "light" ? "dark" : "auto");
  applyTheme();
};
if (mqTheme) {
  if (mqTheme.addEventListener) mqTheme.addEventListener("change", () => { if (themeMode === "auto") applyTheme(); });
  else if (mqTheme.addListener) mqTheme.addListener(() => { if (themeMode === "auto") applyTheme(); });
}
applyTheme();

/* ===== Modal customizado (sem window.prompt / window.confirm) ===== */
function askDialog({title, text = "", defaultValue = null, okText = "Confirmar"}) {
  return new Promise(resolve => {
    const bg = $("#dlg-bg"), inp = $("#dlg-i"), p = $("#dlg-p"), ok = $("#dlg-ok"), no = $("#dlg-no");
    $("#dlg-t").textContent = title;
    p.hidden = !text; p.textContent = text;
    inp.hidden = defaultValue === null;
    if (defaultValue !== null) inp.value = defaultValue;
    ok.textContent = okText;
    bg.hidden = false;
    (defaultValue !== null ? inp : ok).focus();
    if (defaultValue !== null) inp.select();

    const close = val => {
      bg.hidden = true;
      ok.onclick = no.onclick = inp.onkeydown = bg.onclick = null;
      resolve(val);
    };
    ok.onclick = () => close(defaultValue !== null ? inp.value : true);
    no.onclick = () => close(null);
    bg.onclick = e => { if (e.target === bg) close(null); };
    inp.onkeydown = e => {
      if (e.key === "Enter") { e.preventDefault(); ok.click(); }
      if (e.key === "Escape") { e.preventDefault(); no.click(); }
    };
  });
}

/* ===== Syntax highlighting de Python ===== */
const KW = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case".split(" "));
const BI = new Set("print len range int str float list dict set tuple open input sum min max abs sorted enumerate zip map filter isinstance type super round bool any all reversed".split(" "));
const RX = /(#.*)|("""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|(?:[rbfuRBFU]{1,2})?"(?:\\.|[^"\\\n])*"?|(?:[rbfuRBFU]{1,2})?'(?:\\.|[^'\\\n])*'?)|(@\w+)|(\b\d[\d_]*\.?\d*(?:[eE][+-]?\d+)?\b)|([A-Za-z_]\w*)/g;

function HL(t){
  let o = "", i = 0, m;
  RX.lastIndex = 0;
  while((m = RX.exec(t))){
    o += esc(t.slice(i, m.index));
    i = RX.lastIndex;
    const k = m[1] ? "c" : m[2] ? "s" : m[3] ? "d" : m[4] ? "n" : KW.has(m[5]) ? "k" : BI.has(m[5]) ? "b" : "";
    o += k ? `<i class="${k}">${esc(m[0])}</i>` : esc(m[0]);
  }
  return o + esc(t.slice(i)) + "\n";
}

  ta.readOnly = !s;

  upd();
  tabs();

        ? `<span data-a="dl" title="Baixar">↓</span>${n !== "main.py" ? `<span data-a="rm" title="Excluir">×</span>` : ""}`
        : ""
    }</button>`
  ).join("");
}

function dl(n){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([files[n]]));
  a.download = n;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

  const n = b.dataset.n, a = e.target.dataset.a;

    ins("\n" + l.match(/^\s*/)[0] + (/:\s*$/.test(l) ? "    " : ""));

  if (c) e.className = c;
  e.innerHTML = c === "e"
    ? esc(s).replace(/^(\w+(?:Error|Exception|Exit|Interrupt))\b/gm, "<b>$1</b>")
    : esc(s);
  con.append(e);
  con.scrollTop = con.scrollHeight;
}

function pane(id){
  $$(".pane").forEach(p => p.hidden = p.id !== id);
  $$(".rt").forEach(b => b.classList.toggle("on", b.dataset.p === id));
  if (id === "pk") pkList();
}
$$(".rt").forEach(b => b.onclick = () => pane(b.dataset.p));

function setSt(s, p, m){
  ST = s;
  const b = $("#st");
  b.dataset.s = s;
  const labels = {loading: "Carregando", ready: "Pronto", running: "Executando", error: "Erro"};
  b.textContent = (labels[s] || s) + ((s === "loading" || s === "running") && m ? ` · ${m}` : "");
  if (p != null) $("#bar i").style.width = p + "%";
  $("#bar").style.opacity = (s === "loading" || (s === "running" && p != null && p < 100)) ? 1 : 0;
  const r = $("#run");
  r.disabled = (s === "loading" || s === "error");
  r.classList.toggle("stop", s === "running");
  r.innerHTML = s === "running" ? "■ Parar" : "▶ Executar<small>Ctrl+Enter</small>";
}

/* ===== Gerenciador de pacotes ===== */
const CAT = [
  ["numpy", "Computação numérica e arrays"],
  ["pandas", "Análise e manipulação de dados"],
  ["matplotlib", "Gráficos e visualizações"],
  ["scipy", "Computação científica"],
  ["scikit-learn", "Machine learning"],
  ["sympy", "Matemática simbólica"],
  ["networkx", "Grafos e redes"],
  ["pillow", "Processamento de imagens"],
  ["beautifulsoup4", "Análise de HTML"],
  ["requests", "Requisições HTTP"],
  ["seaborn", "Gráficos estatísticos"],
  ["statsmodels", "Modelos estatísticos"],
  ["pyyaml", "Leitura e escrita YAML"],
  ["openpyxl", "Planilhas Excel"],
  ["cowsay", "Vaquinha falante (PyPI)"]
];

function pkList(){
  const q = $("#q").value.trim().toLowerCase();
  const key = n => n.toLowerCase().replace(/_/g, "-");
  const row = (n, d) => {
    const v = inst[key(n)];
    return `<div class="pk"><div><b>${esc(n)}</b><small>${esc(v ? "instalado · " + v : d)}</small></div><button data-p="${esc(n)}"${v ? " disabled" : ""}>${v ? "✓" : "Instalar"}</button></div>`;
  };
  let h = "";
  if (q && !CAT.some(c => c[0] === q) && !inst[key(q)]) {
    h += row(q, "Instalar do Pyodide / PyPI");
  }
  const all = [...CAT, ...Object.keys(inst).filter(n => !CAT.some(c => c[0] === n)).map(n => [n, "Pacote instalado"])];
  $("#pl").innerHTML = h + all
    .filter(([n, d]) => !q || n.includes(q) || d.toLowerCase().includes(q))
    .map(([n, d]) => row(n, d))
    .join("");
}

$("#q").oninput = pkList;
$("#q").onkeydown = e => { if (e.key === "Enter") $("#pl button:not(:disabled)")?.click(); };
$("#pl").onclick = e => {
  const b = e.target.closest("button[data-p]");
  if (!b || b.disabled) return;
  if (ST !== "ready") return put("[PyMeow] aguarde o motor ficar pronto.\n", "sy");
  b.disabled = true;
  b.textContent = "…";
  put("[PyMeow] instalando " + b.dataset.p + "…\n", "sy");
  W.postMessage({t: "install", pkg: b.dataset.p});
};

/* ===== Comunicação com o worker ===== */
function onMsg({data: d}){
  switch (d.t) {
    case "status":
      setSt(d.s, d.p, d.m);
      break;
    case "progress":
      if (ST === "running") setSt("running", d.d, "instalando pacotes");
      break;
    case "out":
      put(d.s, d.s.startsWith("[PyMeow]") ? "sy" : "");
      break;
    case "err":
      put(d.s, d.s.startsWith("[PyMeow]") ? "sy" : "e");
      break;
    case "plot": {
      const i = new Image();
      i.src = "data:image/png;base64," + d.d;
      i.title = "Clique para baixar grafico.png";
      i.onclick = () => {
        const a = document.createElement("a");
        a.href = i.src;
        a.download = "grafico.png";
        a.click();
      };
      $("#plt").append(i);
      pane("plt");
      break;
    }
    case "input": {
      put(d.p);
      pane("con");
      const i = document.createElement("input");
      i.className = "in";
      i.setAttribute("aria-label", "Entrada do programa");
      con.append(i);
      i.focus();
      i.onkeydown = e => {
        if (e.key === "Enter") {
          const v = i.value;
          i.remove();
          put(v + "\n", "u");
          W.postMessage({t: "stdin", v});
        }
      };
      break;
    }
    case "files": {
      let changed = false;
      for (const n in d.d) {
        if (!(n in files)) {
          files[n] = d.d[n];
          changed = true;
        } else if (n !== cur) {
          files[n] = d.d[n];
        }
      }
      if (changed) tabs();
      break;
    }
    case "pkgs":
      Object.keys(inst).forEach(k => delete inst[k]);
      for (const k in d.d) inst[k.toLowerCase().replace(/_/g, "-")] = d.d[k];
      pkList();
      break;
    case "fatal":
      put("Falha ao iniciar o Python: " + d.s + "\nVerifique sua conexão com a internet (CDN jsDelivr).\n", "e");
      setSt("error", 0, "falha no CDN");
      break;
  }
}

function boot(){
  setSt("loading", 5, "iniciando");
  const src = `(${workerMain})(${JSON.stringify(PYURL)}, ${JSON.stringify(PYURL_FALLBACK)}, ${JSON.stringify(BOOT)})`;
  W = new Worker(URL.createObjectURL(new Blob([src], {type: "text/javascript"})));
  W.onmessage = onMsg;
  W.onerror = e => put("Erro no worker: " + e.message + "\n", "e");
}

function run(){
  if (ST !== "ready") return;
  $("#plt").innerHTML = "";
  pane("con");
  const n = /\.py$/.test(cur) ? cur : "main.py";
  W.postMessage({t: "run", code: files[n], name: n, files});
}

function halt(){
  put("[PyMeow] execução interrompida; reiniciando o motor…\n", "sy");
  W.terminate();
  boot();
}

$("#run").onclick = () => ST === "running" ? halt() : run();
$("#clr").onclick = () => { con.innerHTML = ""; };
$("#dlp").onclick = () => dl(/\.py$/.test(cur) ? cur : "main.py");
addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    run();
  }
});

/* ===== Divisor redimensionável ===== */
const sp = $("#sp"), mn = $("#m");
sp.onpointerdown = e => { sp.setPointerCapture(e.pointerId); sp.classList.add("on"); };
sp.onpointermove = e => {
  if (!sp.classList.contains("on")) return;
  const r = mn.getBoundingClientRect();
  const p = innerWidth > 760 ? (e.clientX - r.left) / r.width : (e.clientY - r.top) / r.height;
  mn.style.setProperty("--l", Math.min(80, Math.max(20, p * 100)) + "%");
};
sp.onpointerup = () => sp.classList.remove("on");

put("PyMeow · inicializando ambiente Python (pacotes pesados são baixados sob demanda)…\n", "sy");
load();
boot();
})();
</script>
</body>
